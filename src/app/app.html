<ion-menu [content]="nav">
  <ion-header>
  <ion-toolbar>
    <ion-title>
      Shopping
    </ion-title>
  </ion-toolbar>
</ion-header>
  <ion-content>
    <ion-list>
      <button *ngIf="!authService.isAuthenticated()" ion-item icon-left (click)="onLoad(signinPage)">
        <ion-icon name="log-in"></ion-icon>
      Signin</button>
      <button *ngIf="!authService.isAuthenticated()" ion-item icon-left (click)="onLoad(signupPage)">
        <ion-icon name="people"></ion-icon>
      Signup</button>
      <button *ngIf="authService.user | async" ion-item icon-left>
        <ion-icon name="contact"></ion-icon>
      {{ (authService.user | async)?.email }}</button>
      <button ion-item icon-left *ngIf="authService.user | async" (click)="onLogout()">
        <ion-icon name="log-out"></ion-icon>
      Logout</button>
      <button ion-item icon-left (click)="onLoad(rootPage)">
        <ion-icon name="close-circle"></ion-icon>
      Close</button>
    </ion-list>
  </ion-content>
</ion-menu>


<ion-nav [root]="rootPage" #nav></ion-nav>
