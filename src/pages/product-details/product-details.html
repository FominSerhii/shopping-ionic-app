<ion-header>

  <ion-navbar>
    <ion-title>
      Product
    </ion-title>
  </ion-navbar>

</ion-header>


<ion-content class="bg-style"  >

    <ion-card *ngIf='product'>
      <ion-card-header>
        <img src={{product.imagePath}}/>
      </ion-card-header>


      <ion-card-content>
        <h2> <b>{{product.name}} </b> </h2>
        <p> {{product.price}} </p>
        <p> {{product.description}} </p>
      </ion-card-content>
    </ion-card>

    <ion-fab right bottom (click)="addToCart()">
      <button ion-fab><ion-icon name="ios-cart" ></ion-icon></button>
    </ion-fab>

</ion-content>
