<ion-header>
  <ion-navbar>
    <button ion-button icon-only menuToggle>
        <ion-icon name="menu"></ion-icon>
      </button>
    <ion-title>
      Favourites
    </ion-title>
  </ion-navbar>
</ion-header>


<ion-content class="bg-style">

  <div *ngFor="let product of favouriteProducts">

    <ion-card>
      <ion-card-header>
        <img src={{product.imagePath}}/>
      </ion-card-header>


      <ion-card-content>
        <h2> <b>{{ product.name }} </b> </h2>
        <p> {{ product.price }} </p>
        <p> {{ product.description }} </p>
      </ion-card-content>

      <button ion-button clear item-end (click)="onDeleteFavourite(product)">
        <ion-icon style="font-size: 25px;" name="trash"></ion-icon>
      </button>
      <button ion-button clear item-end (click)="onDeleteFavourite(product)">
        <ion-icon style="font-size: 25px;" name="cart"></ion-icon>
      </button>

    </ion-card>

  </div>

</ion-content>
