
  <ion-header>

    <ion-navbar>
      <ion-buttons start>
        <button ion-button icon-only menuToggle>
          <ion-icon name="menu"></ion-icon>
        </button>
      </ion-buttons>
      <ion-title>Signin</ion-title>
    </ion-navbar>

  </ion-header>

  <ion-content padding>

    <ion-row>
      <ion-col width-67>
        <img src="https://signin.riams.org/res/images/icons/1829_RIAMS_icon_my_account.png"/>
      </ion-col>
    </ion-row>

    <form #f="ngForm" (ngSubmit)="onSignin(f)">
      <ion-list>
        <ion-item>
          <ion-label fixed>Mail</ion-label>
          <ion-input type="email" ngModel name="email" required></ion-input>
        </ion-item>
        <ion-item>
          <ion-label fixed>Password</ion-label>
          <ion-input type="password" ngModel name="password" required [minlength]="6"></ion-input>
        </ion-item>
      </ion-list>
      <button ion-button block type="submit" [disabled]="!f.valid">Signin</button>
    </form>

</ion-content>
