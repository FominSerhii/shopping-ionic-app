<ion-header>
  <ion-navbar>
    <button ion-button icon-only menuToggle>
        <ion-icon name="menu"></ion-icon>
      </button>
    <ion-title>
      Cart
    </ion-title>
  </ion-navbar>
</ion-header>


<ion-content padding>

  <ion-item *ngFor="let product of cartProducts" class="col-md-4 item-product">

    <ion-thumbnail item-start (click)="showDetails(product)">
        <ion-img
          [src]="product.imagePath"
          alt="{{ product.imagePath }}"
          class="img-responsive">
        </ion-img>
      </ion-thumbnail>

      <ion-row>
        <h2>{{ product.name }}</h2>
      </ion-row>
      <ion-row>
        <p>{{ product.price }} UAH</p>
      </ion-row>
      <ion-row>
        <p>{{ product.description }}</p>
      </ion-row>

      <button ion-button clear item-end (click)="onDeleteCart(product)">
        <ion-icon style="font-size: 25px;" name="trash"></ion-icon>
      </button>

    </ion-item>
</ion-content>

<ion-nav id="nav" #content [root]="rootPage"></ion-nav>
